<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ملف إنجاز مرح أحمد محمد أبو الطرابيش</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;

        body {

            background: #f5f7fb;
            color: #1f2937;
            line-height: 1.8;
            overflow-x: hidden;
        }

        a {
            text-decoration: none;
        }

        .container {
            width: min(1100px, 92%);
            margin: auto;
        }

        /* NAVBAR */
        nav {
            background: #111827;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 3px 15px rgba(0,0,0,.15);
        }

        .nav-container {
            width: min(1150px, 94%);
            margin: auto;
            min-height: 65px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .logo {
            color: white;
            font-size: 19px;
            font-weight: bold;
            white-space: nowrap;
        }

        .nav-links {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            list-style: none;
            flex-wrap: wrap;
        }

        .nav-links a {
            color: #fff;
            padding: 7px 10px;
            border-radius: 7px;
            font-size: 14px;
            transition: .2s;
        }

        .nav-links a:hover {
            background: #374151;
        }

        /* HERO */
        .hero {
            min-height: 520px;
            display: flex;
            align-items: center;
            text-align: center;
            background: linear-gradient(135deg, #111827, #263449);
            color: white;
            padding: 70px 20px;
        }

        .hero-content {
            width: min(850px, 100%);
            margin: auto;
        }

        .hero h1 {
            font-size: clamp(30px, 5vw, 52px);
            margin-bottom: 12px;
        }

        .hero h2 {
            font-size: clamp(19px, 3vw, 28px);
            font-weight: normal;
            margin-bottom: 20px;
            color: #e5e7eb;
        }

        .hero p {
            max-width: 720px;
            margin: auto;
            color: #d1d5db;
            font-size: 17px;
        }

        .hero-button {
            display: inline-block;
            margin-top: 28px;
            padding: 12px 28px;
            border-radius: 9px;
            background: white;
            color: #111827;
            font-weight: bold;
        }

        /* SECTIONS */
        section {
            padding: 70px 0;
            scroll-margin-top: 75px;
        }

        .section-title {
            text-align: center;
            margin-bottom: 40px;
        }

        .section-title h2 {
            font-size: 32px;
            color: #111827;
            margin-bottom: 8px;
        }

        .section-title p {
            color: #6b7280;
        }

        /* ABOUT */
        .about-box {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 5px 20px rgba(0,0,0,.06);
            max-width: 900px;
            margin: auto;
            text-align: center;
        }

        .about-box p {
            margin-bottom: 12px;
        }

        /* STUDENT DATA */
        .student-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 18px;
        }

        .student-card {
            background: white;
            padding: 22px;
            border-radius: 14px;
            box-shadow: 0 4px 16px rgba(0,0,0,.06);
        }

        .student-card strong {
            display: block;
            color: #111827;
            margin-bottom: 5px;
        }

        .student-card span {
            color: #4b5563;
        }
